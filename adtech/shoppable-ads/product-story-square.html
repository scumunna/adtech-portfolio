<script>
var storyIdx=0,storyTimer=null,storyDuration=4000;
var slides=document.querySelectorAll('.story-slide');
var bars=document.querySelectorAll('.story-bar');
function showStory(i){
    if(i<0)i=slides.length-1;if(i>=slides.length)i=0;storyIdx=i;
    slides.forEach(s=>s.classList.remove('active'));bars.forEach(b=>{b.classList.remove('active','done');b.querySelector('.story-bar-fill').style.width='0%';});
    slides[i].classList.add('active');
    for(var j=0;j<i;j++){bars[j].classList.add('done');bars[j].querySelector('.story-bar-fill').style.width='100%';}
    bars[i].classList.add('active');animateBar(i);
}
function animateBar(i){
    var fill=bars[i].querySelector('.story-bar-fill');var start=null;
    function step(ts){if(!start)start=ts;var p=Math.min((ts-start)/storyDuration*100,100);fill.style.width=p+'%';if(p<100&&storyIdx===i)requestAnimationFrame(step);else if(p>=100)showStory(i+1);}
    requestAnimationFrame(step);
}
function storyNav(dir){showStory(storyIdx+dir);}
showStory(0);
