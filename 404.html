  <meta charset="UTF-8">

  <title>404 - Page Not Found</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23000'/><text x='16' y='23' text-anchor='middle' fill='%23FCFCFA' font-family='system-ui' font-weight='700' font-size='20'>S</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FCFCFA;--tx:#0F0E0C;--tx2:#5A5A54;--tx3:#62594A;--ac:#0F0E0C;--bd:#E4E0D2;--sf:#FFFFFF}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
    .code{font-family:'Newsreader',Georgia,serif;font-size:clamp(5rem,15vw,8rem);font-weight:500;letter-spacing:-.02em;color:var(--ac);line-height:1}
    .subtitle{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:600;margin:12px 0 16px;letter-spacing:-.01em}
    .desc{font-size:14.5px;color:var(--tx2);max-width:380px;line-height:1.6;margin-bottom:32px}
    .back{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--ac);padding:14px 28px;text-decoration:none;transition:opacity .2s;border:1px solid var(--ac)}
    .back:hover{opacity:.7}
    .foot{position:absolute;bottom:24px;font-size:12px;color:var(--tx3)}
    .foot a{color:var(--tx2);text-decoration:none;transition:color .2s}
    .foot a:hover{color:var(--ac)}
  </style>
</head>
<body>
  <div class="code">404</div>
  <div class="subtitle">Page not found</div>
  <p class="desc">The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" class="back">Back to Portfolio <span aria-hidden="true">&rarr;</span></a>
  <div class="foot">Stephen Umunna &middot; <a href="mailto:scumunna@gmail.com">scumunna@gmail.com</a></div>
</body>
